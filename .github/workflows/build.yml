name: Compilar IPA
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL HTTPS de tu app web (por ejemplo https://tuusuario.github.io/Marginalia/)"
        required: true
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Poner la URL de la app
        run: sed -i '' "s|https://TUUSUARIO.github.io/Marginalia/|${{ github.event.inputs.app_url }}|" QMusic/Config.swift
      - name: Generar el proyecto de Xcode
        run: brew install xcodegen && xcodegen generate
      - name: Compilar sin firmar
        run: |
          xcodebuild -project QMusic.xcodeproj -scheme QMusic -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Empaquetar .ipa
        run: |
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/QMusic.app Payload/
          zip -qr QMusic.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: QMusic-ipa
          path: QMusic.ipa
